<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A4F"/>
      <stop offset="100%" stop-color="#172B3A"/>
    </linearGradient>
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Фон: тёмно-синий скруглённый квадрат -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Мягкое свечение лайма -->
  <circle cx="380" cy="130" r="200" fill="#B7E36A" opacity="0.10"/>

  <!-- Тарелка -->
  <g filter="url(#plateShadow)">
    <circle cx="256" cy="256" r="172" fill="#FFFFFF"/>
    <circle cx="256" cy="256" r="160" fill="#F7F6F0"/>
  </g>

  <!-- Секции тарелки 50% / 25% / 25% -->
  <g stroke="#F7F6F0" stroke-width="6" stroke-linejoin="round">
    <!-- Гарнир 50% — левая половина -->
    <path d="M256 96 A160 160 0 0 0 256 416 L256 256 Z" fill="#B7E36A"/>
    <!-- Белок 25% — верх-право -->
    <path d="M256 96 A160 160 0 0 1 416 256 L256 256 Z" fill="#F0A45D"/>
    <!-- Овощи 25% — низ-право -->
    <path d="M416 256 A160 160 0 0 1 256 416 L256 256 Z" fill="#68B995"/>
  </g>

  <!-- Центральная точка -->
  <circle cx="256" cy="256" r="14" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="6" fill="#172B3A"/>
</svg>